<script type="text/plain" id="renderJS">
var data = JSON.parse(document.getElementById('teadata').textContent);
var html = '';
for(var i=0;i<data.length;i++){
  var tea=data[i];
  html+='<div class="tea-card"><div class="tea-name">'+tea.name+'</div><div class="tea-meta">'+tea.type+' · '+tea.grade+' · 📍 '+tea.origin+'</div><div class="tea-desc">'+tea.desc+'</div></div>';

</script>
